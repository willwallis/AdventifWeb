<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adventif</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #fbfcfc;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      color: #173042;
    }
    #water {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .wash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 28%, rgba(245, 140, 88, .085) 0%, rgba(245, 140, 88, .035) 20%, rgba(255,255,255,0) 46%),
        radial-gradient(ellipse at 50% 48%, rgba(255,255,255,.72) 0%, rgba(255,255,255,.24) 33%, transparent 72%),
        linear-gradient(to bottom, rgba(255,255,255,.12), rgba(255,255,255,.04));
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(255,255,255,0) 52%, rgba(22, 45, 60, .03) 100%);
    }
    main {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .logo-wrap {
      position: relative;
      display: inline-grid;
      place-items: center;
      padding: clamp(0.4rem, 1vw, 0.8rem);
    }
    .logo-wrap::before {
      content: "";
      position: absolute;
      width: min(62vw, 600px);
      height: min(62vw, 600px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.92) 0%, rgba(255,255,255,.52) 38%, rgba(255,255,255,.12) 58%, rgba(255,255,255,0) 72%);
      filter: blur(16px);
      z-index: -1;
    }
    .logo {
      display: block;
      width: min(42vw, 460px);
      max-width: 100%;
      max-height: 58vh;
      object-fit: contain;
      filter:
        drop-shadow(0 22px 44px rgba(10, 26, 41, .08))
        drop-shadow(0 6px 18px rgba(14, 34, 51, .08));
      animation: float 7s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @media (max-width: 900px) {
      .logo { width: min(56vw, 420px); }
    }
    @media (max-width: 600px) {
      .logo { width: min(74vw, 360px); }
      .logo-wrap::before { width: min(92vw, 470px); height: min(92vw, 470px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; }
      #water { opacity: .72; }
    }
  </style>
</head>
<body>
  <canvas id="water" aria-hidden="true"></canvas>
  <div class="wash" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <main aria-label="Home">
    <div class="logo-wrap">
      <img class="logo" src="images/Adventif_Logo.png">
    </div>
  </main>

  <script>
    const canvas = document.getElementById('water');
    const ctx = canvas.getContext('2d', { alpha: false });
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let width, height, dpr;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();

    function draw(ms) {
      const t = reduceMotion ? 0 : ms * 0.00016;

      // Base field: clean white with a faint cool cast.
      const bg = ctx.createLinearGradient(0, 0, 0, height);
      bg.addColorStop(0, '#fcfdfd');
      bg.addColorStop(0.45, '#fbfcfc');
      bg.addColorStop(1, '#f7fafb');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, width, height);

      // Soft warm bloom near the top center to echo the logo sky.
      const warmX = width * 0.5 + Math.sin(t * 1.4) * 18;
      const warmY = height * 0.23;
      const warmR = Math.max(width, height) * 0.28;
      const warm = ctx.createRadialGradient(warmX, warmY, 0, warmX, warmY, warmR);
      warm.addColorStop(0, 'rgba(240, 127, 74, 0.060)');
      warm.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = warm;
      ctx.fillRect(0, 0, width, height);

      // Subtle horizontal wind ripples across the page.
      const spacing = Math.max(12, Math.min(20, width / 96));
      const amp = Math.min(6.0, Math.max(2.4, width / 310));
      for (let row = -4; row < height / spacing + 5; row++) {
        const y0 = row * spacing;
        const phase = row * 0.58;

        for (let layer = 0; layer < 3; layer++) {
          ctx.beginPath();
          for (let x = -12; x <= width + 14; x += 7) {
            const longWave = Math.sin(x * 0.011 + phase + t * (layer === 0 ? 1.0 : layer === 1 ? -0.76 : 0.42));
            const shortWave = Math.sin(x * 0.026 - phase * 0.7 - t * (1.2 + layer * 0.35));
            const shimmer = Math.sin(x * 0.004 + row * 0.18 + t * 0.7);
            const envelope = 0.62 + 0.38 * shimmer;
            const offset = layer * 2.0;
            const y = y0 + amp * envelope * (longWave + 0.22 * shortWave) + offset;
            if (x === -12) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = layer === 0
            ? 'rgba(76, 121, 140, 0.115)'
            : layer === 1
              ? 'rgba(104, 145, 160, 0.075)'
              : 'rgba(143, 175, 186, 0.045)';
          ctx.lineWidth = layer === 0 ? 0.95 : layer === 1 ? 1.1 : 0.7;
          ctx.stroke();
        }
      }

      // Passing specular highlights.
      for (let i = 0; i < 6; i++) {
        const cx = width * (0.09 + i * 0.17) + Math.sin(t * (0.5 + i * 0.07) + i * 1.8) * 70;
        const cy = height * (0.18 + (i % 3) * 0.24);
        const radius = Math.max(width, height) * (0.15 + (i % 2) * 0.035);
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        g.addColorStop(0, 'rgba(255,255,255,0.16)');
        g.addColorStop(0.35, 'rgba(255,255,255,0.06)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
      }

      if (!reduceMotion) requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
